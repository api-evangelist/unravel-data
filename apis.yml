aid: unravel-data
name: Unravel Data
description: >-
  Unravel Data is an AI-powered data observability and FinOps platform for
  modern data stacks - Databricks, Snowflake, Google BigQuery, and Cloudera.
  Its Arvix engine ingests metadata and telemetry (never customer data),
  identifies cost and performance inefficiencies, and applies validated
  optimizations either automatically (AutoApply) or with human-in-the-loop
  approval. A REST API exposes cost data, efficiency scores, optimization
  queues, and action history (reference docs are gated behind the customer
  portal), with native CI/CD plugins for GitHub Actions and Jenkins. Unravel
  is SOC 2 Type II certified and backed by investors including GGV Capital.
